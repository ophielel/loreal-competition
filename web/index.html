<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>知微 · 消费者服务工作台</title><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%231f2937'/%3E%3Ctext x='32' y='46' text-anchor='middle' font-size='40' fill='white'%3E知%3C/text%3E%3C/svg%3E"><link rel="stylesheet" href="/style.css"><script src="/app.js" defer></script></head>
<body>
<nav class="rail" aria-label="主导航"><div class="brand-symbol">知</div><button class="rail-button selected" data-view="desk" aria-label="接待工作台"><svg viewBox="0 0 16 16" aria-hidden="true"><rect x="1" y="2" width="9" height="12"/><rect x="12" y="5" width="3" height="9"/></svg><small>接待</small></button><button class="rail-button" data-view="tasks" aria-label="跟进任务"><svg viewBox="0 0 16 16" aria-hidden="true"><rect x="1" y="1" width="14" height="3"/><rect x="1" y="7" width="14" height="3"/><rect x="1" y="13" width="14" height="3"/></svg><small>跟进</small></button><button class="rail-button" data-view="metrics" aria-label="数据评估"><svg viewBox="0 0 16 16" aria-hidden="true"><rect x="1" y="9" width="4" height="6"/><rect x="6" y="5" width="4" height="10"/><rect x="11" y="1" width="4" height="14"/></svg><small>洞察</small></button><button class="rail-button bottom" data-view="about" aria-label="项目说明"><svg viewBox="0 0 16 16" aria-hidden="true"><rect x="1" y="1" width="14" height="14"/><rect x="4" y="4" width="8" height="2" fill="#e5e7eb"/><rect x="4" y="8" width="8" height="1.5" fill="#e5e7eb"/><rect x="4" y="11" width="5" height="1.5" fill="#e5e7eb"/></svg><small>说明</small></button><div class="avatar operator">CW</div></nav>
<div class="shell">
<header class="topbar"><div class="topbar-title"><span class="eyebrow">BEAUTY TECHATHON / 2026</span><h1>知微 <span class="divider">/</span> 消费者服务工作台 <span class="muted">测试美妆旗舰店 · 本地演示</span></h1></div><div class="top-actions"><span class="muted"><b id="session-count">—</b> 个会话</span><span class="pill green" id="mode-label">规则模式 · 可离线使用</span><button id="about-button" class="text-button">使用说明</button></div></header>
<main id="desk-view" class="desk">
<aside class="inbox" aria-label="会话列表"><div class="inbox-heading"><h2>接待列表 <span id="list-count" class="count">138</span></h2></div><label class="search"><span>⌕</span><input id="search" type="search" placeholder="搜索昵称、会话或咨询内容" aria-label="搜索会话"></label><div class="filter-row"><button class="filter active" data-filter="all">全部</button><button class="filter" data-filter="high">高关注</button><button class="filter" data-filter="order">订单售后</button></div><div id="session-list" class="session-list" aria-live="polite">正在读取会话…</div></aside>
<section class="conversation" aria-label="聊天与回放"><header class="customer-head"><div class="avatar" id="buyer-avatar">—</div><div><h2 id="buyer-name">正在载入</h2><div id="buyer-meta" class="muted">—</div></div><button id="export-button" class="text-button">导出记录 ↓</button></header><section id="order-card" class="order-card"></section><section class="replay"><div><span class="pill neutral" id="replay-mode">历史回放</span><span id="cursor-label">消息 1</span></div><span class="time-notice" id="time-notice"></span><div class="replay-controls"><button id="prev" aria-label="上一条消息">‹</button><input id="cursor" type="range" min="1" max="10" value="1" aria-label="消息回放进度"><button id="next" aria-label="下一条消息">›</button><button id="show-all" class="text-button">全部</button><button id="archive" class="text-button">归档快照</button></div></section><div id="messages" class="messages" aria-live="polite"></div><section class="composer"><label for="reply" class="sr-only">回复草稿</label><textarea id="reply" placeholder="采用右侧建议，或在这里编辑回复…" maxlength="2000"></textarea><div class="composer-bottom"><span class="muted">模拟发送仅保存在当前页面 · 由客服审核后决定</span><button id="send" class="primary">模拟发送 ↗</button></div></section></section>
<aside class="copilot" aria-label="知微辅助面板"><header class="copilot-head"><div><h2>知微 Copilot</h2><span class="pill green small">辅助决策</span></div></header><div class="tabs" role="tablist"><button role="tab" aria-selected="true" class="tab active" data-tab="insight">即时洞察</button><button role="tab" aria-selected="false" class="tab" data-tab="journey">服务轨迹</button><button role="tab" aria-selected="false" class="tab" data-tab="evidence">证据与流程</button></div><div id="copilot-content" class="copilot-content" role="tabpanel"></div><footer class="copilot-footer"><span id="analysis-mode">规则基线 · 需人工复核</span><button id="model-button" class="text-button">Qwen 分析 ↗</button></footer></aside>
</main>
<main id="alternate-view" class="alternate" hidden></main>
</div>
<div id="toast" role="status" class="toast" hidden></div>
<dialog id="task-dialog"><form id="task-form"><div class="dialog-header"><div><span class="eyebrow">HUMAN IN THE LOOP</span><h2>确认跟进任务</h2></div><button type="button" id="close-dialog" aria-label="关闭">×</button></div><p class="muted">任务保存在本机，不会向千牛、物流或支付系统发出指令。</p><label for="task-title">任务名称</label><input id="task-title" maxlength="100" required><label for="task-note">核实说明</label><textarea id="task-note" maxlength="2000" rows="4"></textarea><button type="submit" class="primary">确认创建本地任务</button></form></dialog>
</body></html>
